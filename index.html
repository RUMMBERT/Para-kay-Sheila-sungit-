
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para kay Sheila sungit</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "Trebuchet MS", sans-serif;
    background: #fff0f3;
}

.scene {
    text-align: center;
    width: 100%;
    padding: 15px;
}

h2 {
    color: #b65d79;
    font-size: 23px;
}

.envelope {
    position: relative;
    width: min(330px, 88vw);
    height: 215px;
    margin: 65px auto 20px;
    background: #f5b9c9;
    border: 4px solid #393038;
    border-radius: 12px;
    cursor: pointer;
    perspective: 900px;
    box-shadow: 0 9px 20px #c77c9240;
}

.back {
    position: absolute;
    inset: 0;
    background: #f8cbd6;
    border-radius: 7px;
}

.flap {
    position: absolute;
    inset: 0;
    background: #f2b3c5;
    clip-path: polygon(0 0, 100% 0, 50% 58%);
    border-bottom: 3px solid #393038;
    transform-origin: top;
    transition: transform 0.8s ease;
    z-index: 5;
}

.front {
    position: absolute;
    inset: 0;
    background: #f6c0cf;
    clip-path: polygon(0 100%, 0 0, 50% 57%, 100% 0, 100% 100%);
    border-radius: 7px;
    z-index: 4;
}

.seal {
    position: absolute;
    z-index: 6;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 48px;
    transition: opacity .3s;
}

.letter {
    position: absolute;
    width: 88%;
    height: 180px;
    left: 6%;
    top: 12px;
    background: #fff9ed;
    border: 2px solid #dca7a7;
    border-radius: 9px;
    z-index: 2;
    padding: 18px 12px;
    color: #8d455b;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: transform 1s ease, height 1s ease;
}

.message {
    font-size: 19px;
    line-height: 1.6;
    font-weight: bold;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .8s .7s, transform .8s .7s;
}

.decoration {
    position: absolute;
    font-size: 20px;
    color: #d57991;
}

.d1 { top: 8px; left: 10px; }
.d2 { top: 8px; right: 10px; }
.d3 { bottom: 8px; left: 10px; }
.d4 { bottom: 8px; right: 10px; }

button {
    border: none;
    border-radius: 25px;
    padding: 12px 25px;
    background: #d97998;
    color: white;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 10px #d9799840;
}

button:hover {
    background: #bd5f80;
}

.hint {
    color: #a65d77;
    font-size: 14px;
}

.envelope.open .flap {
    transform: rotateX(180deg);
    z-index: 1;
}

.envelope.open .seal {
    opacity: 0;
}

.envelope.open .letter {
    height: 270px;
    transform: translateY(-150px);
    z-index: 7;
}

.envelope.open .message {
    opacity: 1;
    transform: translateY(0);
}

.heart {
    position: fixed;
    bottom: -30px;
    color: #e77e9f;
    pointer-events: none;
    animation: floatUp 4s linear forwards;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: 1; }
    100% {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
    }
}

@media (max-height: 650px) {
    .envelope {
        margin-top: 35px;
    }
}
</style>
</head>

<body>
<div class="scene">
    <h2>💌Para kay Sheila Sungit💌</h2>

    <div class="envelope" id="envelope">
        <div class="back"></div>

        <div class="letter">
            <span class="decoration d1">♥</span>
            <span class="decoration d2">♥</span>
            <span class="decoration d3">♥</span>
            <span class="decoration d4">♥</span>

            <div class="message">
                why nag tatampo ang nanay
                sungit ko nayan? 💗
            </div>
        </div>

        <div class="flap"></div>
        <div class="front"></div>
        <div class="seal">♥</div>
    </div>

    <p class="hint" id="hint">Tap the envelope to open your letter!</p>
    <button id="openBtn">Open Letter 💌</button>
</div>

<script>
const envelope = document.getElementById("envelope");
const button = document.getElementById("openBtn");
const hint = document.getElementById("hint");

let isOpen = false;

function toggleLetter() {
    isOpen = !isOpen;
    envelope.classList.toggle("open", isOpen);

    button.textContent = isOpen
        ? "Isara mo 💌"
        : "Pindot mo 💌";

    hint.textContent = isOpen
        ? "💗"
        : "💗Buksan mo nayyyyyyyyyyyy💗";

    if (isOpen) {
        for (let i = 0; i < 12; i++) {
            setTimeout(createHeart, i * 120);
        }
    }
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = Math.random() > 0.5 ? "♥" : "♡";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (16 + Math.random() * 22) + "px";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}

envelope.addEventListener("click", toggleLetter);
button.addEventListener("click", toggleLetter);
</script>
</body>
</html>
